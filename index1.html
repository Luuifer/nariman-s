<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بۆ تاقانەکەم Nahi | Nariman</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100;300;400;700&family=Alex+Brush&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {
            --amber: #ff9500;
            --dark-gold: #b36b00;
            --dark: #020202;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: #fff9f2;
            font-family: 'Noto Sans Arabic', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            user-select: none;
        }

        /* Cinematic Background */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 149, 0, 0.05) 0%,
                transparent 80%
            );
            z-index: -2;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, #000 150%);
            pointer-events: none;
            z-index: 10;
        }

        #particles-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        /* Premium Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 3px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--amber);
            border-radius: 10px;
        }

        .glass-box {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 149, 0, 0.1);
            border-radius: 40px;
        }

        /* Writing Animation */
        .brush-path {
            fill: transparent;
            stroke: var(--amber);
            stroke-width: 1.2;
            opacity: 0;
            filter: drop-shadow(0 0 8px var(--amber));
        }

        .anim-write {
            animation: fadeWrite 4s forwards;
        }

        @keyframes fadeWrite {
            to {
                opacity: 1;
                fill: var(--amber);
            }
        }

        /* Flower */
        .flower-layer {
            position: absolute;
            z-index: -1;
            width: 400px;
            height: 400px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 3s cubic-bezier(0.19, 1, 0.22, 1);
            filter: blur(1px)
                drop-shadow(0 0 20px rgba(255, 149, 0, 0.4));
        }

        .flower-bloom {
            opacity: 0.8;
            transform: scale(1.2) rotate(15deg);
        }

        .petal {
            fill: var(--amber);
            opacity: 0.6;
            transform-origin: center;
            animation: petal-sway 6s infinite ease-in-out;
        }

        @keyframes petal-sway {
            0%,
            100% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(5deg) scale(1.05);
            }
        }

        /* Interactive Orb */
        .orb {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--amber);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--amber);
            cursor: pointer;
            z-index: 100;

            transition: all 1.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .hidden-scene {
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
            transition: 2.5s ease;
        }

        .active-scene {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        #final-card {
            transition: all 2s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .dust {
            position: absolute;
            background: white;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            #main-name {
                font-size: 65px !important;
            }

            .flower-layer {
                width: 260px;
                height: 260px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>
    <div class="vignette"></div>
    <div id="particles-container"></div>

    <!-- INTRO -->
    <div
        id="intro"
        class="fixed inset-0 flex flex-col items-center justify-center z-[500] text-center px-6"
    >
        <h1
            id="intro-l1"
            class="text-2xl md:text-4xl font-extralight mb-6 tracking-wide"
        ></h1>

        <h2
            id="intro-l2"
            class="text-lg md:text-xl text-orange-200/40 mb-12"
        ></h2>

        <button
            id="start-btn"
            class="opacity-0 glass-box px-16 py-4 text-amber-500 uppercase tracking-widest text-[10px] transition-all duration-1000 hover:tracking-[8px] border border-amber-500/20"
        >
            دەستپێکردنی گەشتەکە
        </button>
    </div>

    <!-- MEMORY SCENE -->
    <div
        id="memory-scene"
        class="fixed inset-0 hidden-scene flex items-center justify-center"
    >
        <div id="orb-layer" class="absolute inset-0"></div>

        <p
            id="memory-txt"
            class="text-2xl md:text-5xl px-12 text-center font-light leading-relaxed"
        ></p>
    </div>

    <!-- FINAL SCENE -->
    <div
        id="final-scene"
        class="fixed inset-0 hidden-scene flex flex-col items-center justify-center z-[1000] px-6"
    >
        <div
            class="relative flex items-center justify-center w-full max-w-[600px] h-[300px]"
        >

            <!-- Flower -->
            <div id="flower-svg" class="flower-layer">
                <svg viewBox="0 0 200 200">
                    <g transform="translate(100,100)">

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(0)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(45)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(90)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(135)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(180)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(225)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(270)" />

                        <path class="petal"
                            d="M0,-80 C20,-40 40,-40 0,0 C-40,-40 -20,-40 0,-80"
                            transform="rotate(315)" />

                    </g>
                </svg>
            </div>

            <!-- Name -->
            <svg viewBox="0 0 600 200" class="w-full h-full relative z-10">
                <text
                    x="50%"
                    y="60%"
                    text-anchor="middle"
                    font-family="'Alex Brush', cursive"
                    font-size="90"
                    id="main-name"
                    class="brush-path"
                >
                    Nariman & Nahi
                </text>
            </svg>
        </div>

        <!-- Final Card -->
        <div
            id="final-card"
            class="glass-box p-10 md:p-14 w-full max-w-2xl text-center -mt-10"
        >
            <h3
                id="final-head"
                class="text-xl md:text-2xl font-bold text-amber-500 mb-8 drop-shadow-md"
            ></h3>

            <div
                id="final-body"
                class="max-h-[180px] overflow-y-auto custom-scroll pr-4 text-sm md:text-base leading-[2.3] text-orange-50/70 font-light italic text-justify"
            ></div>
        </div>
    </div>

    <script>

        const memories = [
            "تا ئێستاش، کە سەیری چاوانت دەکەم، جیهان بێدەنگ دەبێت.",
            "چاوانت هێشتا تاکە نیشتمانی ئارامیی دڵمن.",
            "ئەو هەستەی بۆ تۆم هەیە، قەت کۆن نابێت... تەنها قووڵتر دەبێت.",
            "هاتنی تۆ بۆ ژیانم، وەک هێوربوونەوەیەک بوو بۆ هەموو زریانەکانم.",
            "هەندێک شەو، تەنها بیرکردنەوە لە تۆ، بەسە بۆ جوانبوونی خەونەکانم.",
            "گەرمیی نیگاکانت، تاکە تیشکی خۆرە لەناو ساردیی ئەم تەنیاییەمدا.",
            "هەر جارێک ناوت دەبیستم، دڵم وەک یەکەم بینین دەلەرزێتەوە.",
            "لەگەڵ تۆدا، فێری ئەوە بووم کە بێدەنگییش دەتوانێت پڕ بێت لە جوانی.",
            "هەموو شتێک گۆڕا، بەڵام تۆ لە ناوەوەی مندا وەک خۆت مایتەوە.",
            "وتم خۆشم دەوێیت... بەڵام هەندێک هەست، هەموو ڕۆژێک نوێ دەبنەوە."
        ];

        const finalPoem =
            "ڕەنگە پێشتریش پێم وتبیت... بەڵام هەندێک قسە هەن، جارێکی تریان، لە ناخی دڵەوە جوانتر دەوترێن. تا ئێستاش... کە سەیری چاوانت دەکەم، هەمان ئەو هێمنی و لەرزینە دێتەوە ڕێم. هیچ شتێک لە مندا نەگۆڕاوە، بەڵکو هەموو شتێک بۆ تۆ زیاتر بووە. کاتێک ناوت دەهێنم، هەست دەکەم هەموو جوانییەکانی دونیا لە یەک وشەدا کۆبوونەتەوە. تۆ تەنها کەسیت کە توانیت بێیت و هەموو شتێک لە مندا بکەیتە بەهار. تا هەناسی کۆتایی، تەنها تۆ لە ناو دڵمدا دەمێنیتەوە. تۆ ئەو نیگارەیت کە قەت لە چاوەکانمدا ڕەنگی کاڵ نابێتەوە.";

        let step = 0;

        async function startApp() {

            createDust();

            await wait(1000);

            await type(
                "intro-l1",
                "هەندێک هەست هەن... هەرگیز کۆن نابن...",
                75
            );

            await type(
                "intro-l2",
                "چونکە ڕەگەکانیان لەناو دڵدایە.",
                55
            );

            document.getElementById("start-btn").style.opacity = "1";
        }

        document.getElementById("start-btn").onclick = () => {

            document.getElementById("intro").style.opacity = "0";

            setTimeout(() => {

                document.getElementById("intro").remove();

                document
                    .getElementById("memory-scene")
                    .classList.add("active-scene");

                spawnMemoryOrb();

            }, 1200);
        };

        function spawnMemoryOrb() {

            const orb = document.createElement("div");

            orb.className = "orb";

            orb.style.left = (Math.random() * 80 + 10) + "%";
            orb.style.top = (Math.random() * 80 + 10) + "%";

            orb.onclick = async () => {

                step++;

                if (navigator.vibrate) {
                    navigator.vibrate(45);
                }

                if (step <= memories.length) {

                    document.getElementById("memory-txt").innerHTML = "";

                    await type(
                        "memory-txt",
                        memories[step - 1],
                        40
                    );

                    orb.style.left = (Math.random() * 80 + 10) + "%";
                    orb.style.top = (Math.random() * 80 + 10) + "%";

                } else {

                    orb.remove();

                    finalize();
                }
            };

            document.getElementById("orb-layer").appendChild(orb);
        }

        async function finalize() {

            document
                .getElementById("memory-scene")
                .classList.remove("active-scene");

            await wait(1200);

            document
                .getElementById("final-scene")
                .classList.add("active-scene");

            const nameEl = document.getElementById("main-name");

            nameEl.classList.add("anim-write");

            await wait(4500);

            nameEl.style.transition =
                "all 2s cubic-bezier(0.19, 1, 0.22, 1)";

            nameEl.textContent = "Nahi";

            nameEl.style.fontSize = "130px";

            nameEl.style.fill = "var(--amber)";

            document
                .getElementById("flower-svg")
                .classList.add("flower-bloom");

            await wait(1000);

            const card = document.getElementById("final-card");

            card.style.opacity = "1";
            card.style.transform = "translateY(0)";

            await type(
                "final-head",
                "خۆشم دەوێی ژوشکەکەم ئاشقتم بە قوربانت بمم 🧡",
                65
            );

            await type(
                "final-body",
                finalPoem,
                35
            );
        }

        function type(id, text, speed) {

            return new Promise((resolve) => {

                const el = document.getElementById(id);

                el.innerHTML = "";

                let i = 0;

                function typing() {

                    if (i < text.length) {

                        el.innerHTML += text.charAt(i);

                        i++;

                        setTimeout(typing, speed);

                    } else {

                        resolve();
                    }
                }

                typing();
            });
        }

        function createDust() {

            const container =
                document.getElementById("particles-container");

            for (let i = 0; i < 60; i++) {

                const d = document.createElement("div");

                d.className = "dust";

                let size = Math.random() * 2 + 0.5;

                d.style.cssText = `
                    width:${size}px;
                    height:${size}px;
                    left:${Math.random() * 100}%;
                    top:${Math.random() * 100}%;
                `;

                d.animate(
                    [
                        {
                            transform: "translateY(0)",
                            opacity: 0.3
                        },
                        {
                            transform: "translateY(-100vh)",
                            opacity: 0
                        }
                    ],
                    {
                        duration: Math.random() * 10000 + 5000,
                        iterations: Infinity
                    }
                );

                container.appendChild(d);
            }
        }

        const wait = (ms) =>
            new Promise((resolve) => setTimeout(resolve, ms));

        window.onload = startApp;

    </script>

</body>
</html>
